title BC-250 R352 pre-GPU netconsole target diagnostic - no GPU module included
version 0
linux /vmlinuz-7.2.3-r138
initrd /initramfs-7.2.3-r352-netdiag.img
options rdinit=/init console=tty0 loglevel=8 net.ifnames=0 nmi_watchdog=1 hardlockup_panic=1 efi_pstore.pstore_disable=N sysrq_always_enabled panic=0
